name: avitosha-prod

x-common-backend: &common-backend
  build:
    context: ./app/backend
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  user: "65532:65532"
  networks:
    - backend

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    restart: unless-stopped
    init: true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.prod}
      MINIO_REGION_NAME: us-east-1
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env.prod}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    networks:
      - storage

  minio-seed-download:
    image: curlimages/curl:8.16.0
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/download-minio-seed.sh"]
    volumes:
      - ./deploy/download-minio-seed.sh:/scripts/download-minio-seed.sh:ro
      - minio_seed:/seed
    restart: "no"
    networks:
      - outbound

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
      minio-seed-download:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.prod}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?Set MINIO_APP_ACCESS_KEY in .env.prod}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY in .env.prod}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc mb --ignore-existing local/avitosha-photos
        mc anonymous set download local/avitosha-photos
        mc admin user add local "$${MINIO_APP_ACCESS_KEY}" "$${MINIO_APP_SECRET_KEY}" || true
        mc admin policy attach local writeonly --user "$${MINIO_APP_ACCESS_KEY}"
        mc mirror --overwrite /seed local/avitosha-photos/demo
    volumes:
      - minio_seed:/seed:ro
    restart: "no"
    networks:
      - storage

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.prod}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/backend/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER:?Set POSTGRES_USER in .env.prod}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.prod}?sslmode=disable
    command: ["up"]
    restart: "no"
    networks:
      - backend

  auth-service:
    <<: *common-backend
    command: ["/usr/local/bin/auth-service"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: prod
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in .env.prod}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.prod}?sslmode=disable
      GRPC_ADDR: :9091
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env.prod}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in .env.prod}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env.prod}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:?Set ACCESS_TOKEN_TTL in .env.prod}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:?Set REFRESH_TOKEN_TTL in .env.prod}
      LOG_LEVEL: ${LOG_LEVEL:?Set LOG_LEVEL in .env.prod}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:?Set SHUTDOWN_TIMEOUT in .env.prod}
    expose:
      - "9091"

  game-service:
    <<: *common-backend
    command: ["/usr/local/bin/game-service"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: prod
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in .env.prod}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.prod}?sslmode=disable
      GRPC_ADDR: :9092
      PROXYAPI_API_KEY: ${PROXYAPI_API_KEY:-}
      PROXYAPI_BASE_URL: ${PROXYAPI_BASE_URL:?Set PROXYAPI_BASE_URL in .env.prod}
      PROXYAPI_MODEL: ${PROXYAPI_MODEL:?Set PROXYAPI_MODEL in .env.prod}
      PROXYAPI_TIMEOUT: ${PROXYAPI_TIMEOUT:?Set PROXYAPI_TIMEOUT in .env.prod}
      LOG_LEVEL: ${LOG_LEVEL:?Set LOG_LEVEL in .env.prod}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:?Set SHUTDOWN_TIMEOUT in .env.prod}
    expose:
      - "9092"
    networks:
      - backend
      - outbound

  api-gateway:
    <<: *common-backend
    command: ["/usr/local/bin/api"]
    depends_on:
      auth-service:
        condition: service_started
      game-service:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: prod
      HTTP_ADDR: :8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env.prod}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:?Set REFRESH_TOKEN_TTL in .env.prod}
      AUTH_GRPC_ADDR: auth-service:9091
      GAME_GRPC_ADDR: game-service:9092
      S3_ENDPOINT: /storage
      S3_REGION: us-east-1
      S3_BUCKET: avitosha-photos
      S3_ACCESS_KEY_ID: ${MINIO_APP_ACCESS_KEY:?Set MINIO_APP_ACCESS_KEY in .env.prod}
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY in .env.prod}
      S3_UPLOAD_TTL: ${S3_UPLOAD_TTL:-10m}
      S3_MAX_FILE_SIZE: ${S3_MAX_FILE_SIZE:-10485760}
      LOG_LEVEL: ${LOG_LEVEL:?Set LOG_LEVEL in .env.prod}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:?Set SHUTDOWN_TIMEOUT in .env.prod}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend
      - edge

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - edge

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?Set CADDY_ACME_EMAIL in .env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - storage

volumes:
  postgres_data:
    name: avitosha_prod_postgres_data
  caddy_data:
    name: avitosha_prod_caddy_data
  caddy_config:
    name: avitosha_prod_caddy_config
  minio_data:
    name: avitosha_prod_minio_data
  minio_seed:
    name: avitosha_prod_minio_seed

networks:
  backend:
    internal: true
  edge:
  outbound:
  storage:
    internal: true
