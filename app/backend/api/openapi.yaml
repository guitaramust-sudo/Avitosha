openapi: 3.0.3
info:
  title: Avitosha API
  version: 1.0.0
  description: |
    Authentication and virtual pet contract for the Avitosha MVP backend.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: auth
    description: Registration, login, session refresh, logout
  - name: user
    description: Current authenticated user
  - name: pet
    description: Avitosha state, care items, growth, and daily summary
paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentialsRequest'
            examples:
              default:
                value:
                  email: user@example.com
                  password: password123
      responses:
        '201':
          description: User registered successfully
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                default:
                  value:
                    access_token: <JWT_ACCESS_TOKEN>
                    user:
                      id: 8f0ed065-aefa-4f56-87d0-e2ef2ef43f0d
                      email: user@example.com
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/EmailAlreadyExists'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentialsRequest'
            examples:
              default:
                value:
                  email: user@example.com
                  password: password123
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                default:
                  value:
                    access_token: <JWT_ACCESS_TOKEN>
                    user:
                      id: 8f0ed065-aefa-4f56-87d0-e2ef2ef43f0d
                      email: user@example.com
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token and issue a new access token
      operationId: refreshSession
      security:
        - refreshTokenCookie: []
      responses:
        '200':
          description: Token pair rotated successfully
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenSetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
              examples:
                default:
                  value:
                    access_token: <JWT_ACCESS_TOKEN>
        '401':
          $ref: '#/components/responses/RefreshUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session and clear refresh cookie
      operationId: logout
      security:
        - refreshTokenCookie: []
      responses:
        '204':
          description: Logout successful
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenClearedCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me:
    get:
      tags: [user]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                default:
                  value:
                    user:
                      id: 8f0ed065-aefa-4f56-87d0-e2ef2ef43f0d
                      email: user@example.com
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/pet:
    get:
      tags: [pet]
      summary: Get or create the authenticated user's Avitosha
      operationId: getPet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current pet and today's UTC state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetSnapshotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/pet/items/{item_id}/use:
    post:
      tags: [pet]
      summary: Consume an inventory item and update Avitosha atomically
      operationId: usePetItem
      security:
        - bearerAuth: []
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated pet, daily state, and emitted domain events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetCareResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pet or inventory item was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Inventory item is already used, expired, or otherwise unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/pet/daily-summary:
    get:
      tags: [pet]
      summary: Get the previous completed UTC day's pet summary
      operationId: getPetDailySummary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Previous UTC day summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetDailySummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No pet daily state exists for the previous UTC day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token sent in the Authorization header.
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly refresh token cookie scoped to /api/auth.
  headers:
    RefreshTokenSetCookie:
      description: |
        HttpOnly refresh token cookie. In production it must also include Secure.
        Path is /api/auth and SameSite is Lax.
      schema:
        type: string
        example: refresh_token=<OPAQUE_REFRESH_TOKEN>; Path=/api/auth; HttpOnly; SameSite=Lax; Max-Age=2592000
    RefreshTokenClearedCookie:
      description: Clears the refresh token cookie for the current client.
      schema:
        type: string
        example: refresh_token=; Path=/api/auth; HttpOnly; SameSite=Lax; Max-Age=0
  responses:
    InvalidRequest:
      description: Malformed or semantically invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_email:
              value:
                error:
                  code: invalid_request
                  message: Email must be a valid email address
    InvalidCredentials:
      description: Invalid email or password
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_credentials:
              value:
                error:
                  code: invalid_credentials
                  message: Invalid email or password
    EmailAlreadyExists:
      description: Email is already registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            duplicate_email:
              value:
                error:
                  code: email_already_exists
                  message: Email already exists
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: Authentication is required
    RefreshUnauthorized:
      description: Missing refresh cookie or invalid, expired, revoked refresh session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_refresh_cookie:
              value:
                error:
                  code: unauthorized
                  message: Authentication is required
            expired_session:
              value:
                error:
                  code: session_expired
                  message: Session has expired or is no longer valid
    SessionExpired:
      description: Refresh session is expired, revoked, or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            expired_session:
              value:
                error:
                  code: session_expired
                  message: Session has expired or is no longer valid
    InternalError:
      description: Unexpected internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal_error:
              value:
                error:
                  code: internal_error
                  message: Internal server error
  schemas:
    AuthCredentialsRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: password123
      description: |
        Registration and login credentials.
        The auth contract intentionally does not include display_name.
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
          example: 8f0ed065-aefa-4f56-87d0-e2ef2ef43f0d
        email:
          type: string
          format: email
          example: user@example.com
    AuthResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - user
      properties:
        access_token:
          type: string
          description: JWT access token returned in JSON response body.
          example: <JWT_ACCESS_TOKEN>
        user:
          $ref: '#/components/schemas/User'
    RefreshResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
      properties:
        access_token:
          type: string
          description: Newly issued JWT access token.
          example: <JWT_ACCESS_TOKEN>
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    Pet:
      type: object
      additionalProperties: false
      required: [id, name, level, growth_xp, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Авитоша
        level:
          type: integer
          minimum: 1
          maximum: 5
        growth_xp:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PetDailyState:
      type: object
      additionalProperties: false
      required: [id, date, satiety, mood, curiosity, state, happy_xp_granted, ecstatic_xp_granted, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        satiety:
          type: integer
          minimum: 0
          maximum: 100
        mood:
          type: integer
          minimum: 0
          maximum: 100
        curiosity:
          type: integer
          minimum: 0
          maximum: 100
        state:
          type: string
          enum: [CURIOUS, HUNGRY, BORED, CONTENT, HAPPY, ECSTATIC]
        happy_xp_granted:
          type: boolean
        ecstatic_xp_granted:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PetSnapshot:
      type: object
      additionalProperties: false
      required: [pet, daily_state]
      properties:
        pet:
          $ref: '#/components/schemas/Pet'
        daily_state:
          $ref: '#/components/schemas/PetDailyState'
    PetSnapshotResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PetSnapshot'
    PetEvent:
      type: object
      additionalProperties: false
      required: [type, occurred_at, previous_state, new_state, previous_level, new_level, xp_delta]
      properties:
        type:
          type: string
          enum: [PET_STATE_CHANGED, PET_BECAME_HAPPY, PET_BECAME_ECSTATIC, PET_LEVEL_UP]
        occurred_at:
          type: string
          format: date-time
        previous_state:
          type: string
          enum: [CURIOUS, HUNGRY, BORED, CONTENT, HAPPY, ECSTATIC]
        new_state:
          type: string
          enum: [CURIOUS, HUNGRY, BORED, CONTENT, HAPPY, ECSTATIC]
        previous_level:
          type: integer
          minimum: 1
          maximum: 5
        new_level:
          type: integer
          minimum: 1
          maximum: 5
        xp_delta:
          type: integer
          minimum: 0
    PetCareResult:
      allOf:
        - $ref: '#/components/schemas/PetSnapshot'
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items:
                $ref: '#/components/schemas/PetEvent'
    PetCareResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PetCareResult'
    PetNeedChange:
      type: object
      additionalProperties: false
      required: [type, starting_value, ending_value, delta]
      properties:
        type:
          type: string
          enum: [SATIETY, MOOD, CURIOSITY]
        starting_value:
          type: integer
        ending_value:
          type: integer
        delta:
          type: integer
    PetDailySummary:
      type: object
      additionalProperties: false
      required: [date, pet_id, pet_name, starting_state, ending_state, need_changes, starting_growth_xp, earned_growth_xp, ending_growth_xp, starting_level, ending_level, achievements]
      properties:
        date:
          type: string
          format: date
        pet_id:
          type: string
          format: uuid
        pet_name:
          type: string
        starting_state:
          type: string
          enum: [CURIOUS, HUNGRY, BORED, CONTENT, HAPPY, ECSTATIC]
        ending_state:
          type: string
          enum: [CURIOUS, HUNGRY, BORED, CONTENT, HAPPY, ECSTATIC]
        need_changes:
          type: array
          items:
            $ref: '#/components/schemas/PetNeedChange'
        starting_growth_xp:
          type: integer
        earned_growth_xp:
          type: integer
        ending_growth_xp:
          type: integer
        starting_level:
          type: integer
        ending_level:
          type: integer
        achievements:
          type: array
          items:
            type: string
            enum: [BECAME_HAPPY, BECAME_ECSTATIC, LEVEL_UP]
    PetDailySummaryResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PetDailySummary'
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - invalid_credentials
            - unauthorized
            - email_already_exists
            - session_expired
            - pet_not_found
            - pet_day_not_found
            - item_not_found
            - item_unavailable
            - internal_error
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
