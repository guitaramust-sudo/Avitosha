x-common-backend: &common-backend
  build:
    context: ./app/backend
    dockerfile: Dockerfile
  restart: unless-stopped

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-avitosha-minio-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-avitosha-minio-root-password}
      MINIO_REGION_NAME: us-east-1
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-seed-download:
    image: curlimages/curl:8.16.0
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["sed 's/\\r$$//' /scripts/download-minio-seed.sh | /bin/sh"]
    volumes:
      - ./deploy/download-minio-seed.sh:/scripts/download-minio-seed.sh:ro
      - minio_seed:/seed
    restart: "no"

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
      minio-seed-download:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-avitosha-minio-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-avitosha-minio-root-password}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-avitosha-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-avitosha-app-secret-key}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc mb --ignore-existing local/avitosha-photos
        mc anonymous set download local/avitosha-photos
        mc admin user add local "$${MINIO_APP_ACCESS_KEY}" "$${MINIO_APP_SECRET_KEY}" || true
        mc admin policy attach local writeonly --user "$${MINIO_APP_ACCESS_KEY}"
        mc mirror --overwrite /seed local/avitosha-photos/demo
    volumes:
      - minio_seed:/seed:ro
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avitosha}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-avitosha}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/backend/scripts/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/backend/migrations:/migrations:ro
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-avitosha}?sslmode=disable"]
    command: ["up"]
    restart: "no"

  migrate-test:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/backend/migrations:/migrations:ro
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-avitosha}_test?sslmode=disable"]
    command: ["up"]
    restart: "no"

  auth-service:
    <<: *common-backend
    command: ["/usr/local/bin/auth-service"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-avitosha}?sslmode=disable
      GRPC_ADDR: :9091
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-change-me-dev-signing-key}
      JWT_ISSUER: ${JWT_ISSUER:-avitosha}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-avitosha-web}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-5s}
    expose:
      - "9091"

  game-service:
    <<: *common-backend
    command: ["/usr/local/bin/game-service"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-avitosha}?sslmode=disable
      GRPC_ADDR: :9092
      PROXYAPI_API_KEY: ${PROXYAPI_API_KEY:-}
      PROXYAPI_BASE_URL: ${PROXYAPI_BASE_URL:-https://api.proxyapi.ru/openrouter/v1}
      PROXYAPI_MODEL: ${PROXYAPI_MODEL:-qwen/qwen-2.5-7b-instruct}
      PROXYAPI_TIMEOUT: ${PROXYAPI_TIMEOUT:-4s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-5s}
    expose:
      - "9092"

  api-gateway:
    <<: *common-backend
    depends_on:
      auth-service:
        condition: service_started
      game-service:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HTTP_ADDR: :${BACKEND_PORT:-8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      AUTH_GRPC_ADDR: auth-service:9091
      GAME_GRPC_ADDR: game-service:9092
      S3_ENDPOINT: /storage
      S3_REGION: us-east-1
      S3_BUCKET: avitosha-photos
      S3_ACCESS_KEY_ID: ${MINIO_APP_ACCESS_KEY:-avitosha-app}
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_SECRET_KEY:-avitosha-app-secret-key}
      S3_UPLOAD_TTL: ${S3_UPLOAD_TTL:-10m}
      S3_MAX_FILE_SIZE: ${S3_MAX_FILE_SIZE:-10485760}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-5s}
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:${BACKEND_PORT:-8080}/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api-gateway:8080}
      VITE_STORAGE_PROXY_TARGET: http://minio:9000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  minio_seed:
